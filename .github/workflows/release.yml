name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build ControlFontTool.csproj -c Release

      - name: Publish (single file)
        run: >
          dotnet publish ControlFontTool.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Package
        run: Compress-Archive -Path publish/ControlFontTool.exe -DestinationPath "ControlFontTool-${{ github.ref_name }}-win-x64.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --title "ControlFontTool ${{ github.ref_name }}" "ControlFontTool-${{ github.ref_name }}-win-x64.zip"
